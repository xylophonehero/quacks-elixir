# Fly.io config for the staging app: branch `staging` deploys here (see .github/workflows).
app = "quacks-staging"
primary_region = "ams"
kill_signal = "SIGTERM"

[build]

[env]
  PHX_HOST = "quacks-staging.fly.dev"
  APP_ENV = "staging"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
