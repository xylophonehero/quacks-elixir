# Fly.io config for Quacks. Games live in memory, so we keep exactly one machine
# running at all times: auto-stop would wipe every running game when the last tab closes.
app = "quacks"
primary_region = "ams"
kill_signal = "SIGTERM"

[build]

[env]
  PHX_HOST = "quacks.fly.dev"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
